[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pdf-diff-system"
version = "0.1.0"
description = "PDF差分検出システム - ベースライン実装とA/Bテスト基盤"
authors = ["AICE Team"]
readme = "README.md"
packages = [{include = "apps"}]
package-mode = true

[tool.poetry.dependencies]
python = "^3.11"
# PDF処理
PyMuPDF = "^1.23.8"
# テキスト類似度計算
python-Levenshtein = "^0.23.0"
# 統計解析
scipy = {version = "^1.11.0", optional = true}
# 性能監視
psutil = {version = "^5.9.0", optional = true}
# MeCab日本語形態素解析
mecab-python3 = "^1.0.6"
# 基本ライブラリ
numpy = "^1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[tool.poetry.group.test.dependencies]
pytest-benchmark = "^4.0.0"
pytest-mock = "^3.11.0"

[tool.poetry.extras]
statistical = ["scipy"]
monitoring = ["psutil"]
full = ["scipy", "psutil"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=apps --cov-report=html --cov-report=term"