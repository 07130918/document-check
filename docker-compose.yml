services:
  # v5 LLM版サービス
  pdf-diff-v5-llm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-v5-llm
    volumes:
      # ソースコードマウント（開発用）
      - .:/app
      # 結果保存用
      - ./output:/app/output
      - ./data:/app/data
      - ./docs:/app/docs
    environment:
      # MeCab設定
      - MECAB_CHARSET=utf8
      - MECAB_DICDIR=/var/lib/mecab/dic/ipadic
      - MECABRC=/etc/mecabrc
      # Python設定
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # Azure/OpenAI API設定（.envファイルから読み込み）
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    working_dir: /app
    command: poetry run python apps/llm_docs_diff_v5/test_llm_diff_v5.py --dataset dantai --use-llm
    
  # v1 標準版サービス
  pdf-diff-v1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-v1
    volumes:
      - .:/app
      - ./output:/app/output
      - ./data:/app/data
      - ./docs:/app/docs
    environment:
      - MECAB_CHARSET=utf8
      - MECAB_DICDIR=/var/lib/mecab/dic/ipadic
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - USE_AZURE_FOR_OCR=True
    working_dir: /app
    command: poetry run python apps/llm_docs_diff_v1/test_llm_diff_v1.py --dataset sample1
    
  # v2 標準版サービス
  pdf-diff-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-v2
    volumes:
      - .:/app
      - ./output:/app/output
      - ./data:/app/data
      - ./docs:/app/docs
    environment:
      - MECAB_CHARSET=utf8
      - MECAB_DICDIR=/var/lib/mecab/dic/ipadic
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - USE_AZURE_FOR_OCR=True
    working_dir: /app
    command: poetry run python apps/llm_docs_diff_v2/test_llm_diff_v2.py --dataset sample1
    
  # v4 標準版サービス
  pdf-diff-v4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-v4
    volumes:
      - .:/app
      - ./output:/app/output
      - ./data:/app/data
      - ./docs:/app/docs
    environment:
      - MECAB_CHARSET=utf8
      - MECAB_DICDIR=/var/lib/mecab/dic/ipadic
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - USE_AZURE_FOR_OCR=True
    working_dir: /app
    command: poetry run python apps/llm_docs_diff_v4/test_llm_diff_v4_sample1.py
    
  # v3 LLM版サービス
  pdf-diff-v3-llm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-v3-llm
    volumes:
      - .:/app
      - ./output:/app/output
      - ./data:/app/data
      - ./docs:/app/docs
    environment:
      - MECAB_CHARSET=utf8
      - MECAB_DICDIR=/var/lib/mecab/dic/ipadic
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    working_dir: /app
    command: poetry run python apps/llm_docs_diff_v3/test_llm_diff_v3.py --dataset dantai --use-llm-summary
    
  # v5 標準版サービス
  pdf-diff-v5:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-v5
    volumes:
      - .:/app
      - ./output:/app/output
      - ./data:/app/data
      - ./docs:/app/docs
    environment:
      - MECAB_CHARSET=utf8
      - MECAB_DICDIR=/var/lib/mecab/dic/ipadic
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
    working_dir: /app
    command: poetry run python apps/llm_docs_diff_v5/test_llm_diff_v5.py --dataset dantai
    
  # ベースライン版サービス
  pdf-diff-baseline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-baseline
    volumes:
      - .:/app
      - ./output:/app/output
      - ./data:/app/data
      - ./docs:/app/docs
    environment:
      - MECAB_CHARSET=utf8
      - MECAB_DICDIR=/var/lib/mecab/dic/ipadic
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
    working_dir: /app
    command: poetry run python apps/diff_baseline/test_baseline.py --dataset default
    
  # 開発用サービス（対話的実行）
  pdf-diff-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-dev
    volumes:
      - .:/app
      - ./output:/app/output
      - ./data:/app/data
      - ./docs:/app/docs
    environment:
      - MECAB_CHARSET=utf8
      - MECAB_DICDIR=/var/lib/mecab/dic/ipadic
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    working_dir: /app
    stdin_open: true
    tty: true
    command: /bin/bash
    
  # Jupyter Lab サービス
  pdf-diff-jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-jupyter
    volumes:
      - .:/app
      - ./notebooks:/app/notebooks
      - ./output:/app/output
      - ./data:/app/data
    environment:
      - MECAB_CHARSET=utf8
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    working_dir: /app
    ports:
      - "8888:8888"
    command: poetry run jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    
  # テスト実行サービス
  pdf-diff-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-diff-test
    volumes:
      - .:/app
      - ./test-results:/app/test-results
    environment:
      - MECAB_CHARSET=utf8
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    working_dir: /app
    command: poetry run pytest --cov-report=html:test-results/coverage
    
volumes:
  poetry_cache:
    driver: local